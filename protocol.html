<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffe8f0">
  <title>Protocol | WonderPeps PH</title>
  <link rel="stylesheet" href="storefront.css?v=info-pages-cute-v2">
</head>
<body class="wonder-info-page" data-page-name="protocol">
  <header class="wonder-info-header">
    <a class="wonder-info-back" href="index.html" aria-label="Back to menu">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5m0 0 6-6m-6 6 6 6"/></svg>
    </a>
    <h1>Protocol</h1>
    <span class="wonder-info-header-spacer" aria-hidden="true"></span>
  </header>

  <main class="wonder-info-content">
    <section class="wonder-search-card" aria-labelledby="searchCardTitle">
      <div class="wonder-search-card-heading">
        <span class="wonder-search-sparkle" aria-hidden="true">♡</span>
        <div>
          <h2 id="searchCardTitle">Find Protocol</h2>
          <p>Search through our protocol collection</p>
        </div>
      </div>
      <form class="wonder-search-form" role="search">
        <label class="wonder-search-field">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.2 4.2"/></svg>
          <input type="search" name="q" placeholder="Search Protocol..." autocomplete="off" aria-label="Search Protocol">
        </label>
        <button class="wonder-search-submit" type="submit">Search</button>
      </form>
      <p class="wonder-search-feedback" role="status" aria-live="polite">Type a keyword to search.</p>
    </section>

    <section class="wonder-info-results" aria-label="Protocol results">
      <div class="wonder-info-empty">
        <span aria-hidden="true">♡</span>
        <p>No protocol content has been added yet.</p>
        <small>When documents are added, you can find them here.</small>
      </div>
    </section>
  </main>
  <script src="info-pages.js?v=cute-search-v1"></script>
</body>
</html>
