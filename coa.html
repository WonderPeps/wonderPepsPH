<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7fa">
  <title>COA | WonderPeps PH</title>
  <link rel="stylesheet" href="storefront.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #5c3e4c; background: linear-gradient(145deg,#fffafd,#fff0f6); font-family: Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .info-page { width: min(680px,calc(100% - 32px)); margin: 0 auto; padding: 24px 0; }
    .info-card { min-height: min(620px,calc(100vh - 48px)); padding: clamp(22px,5vw,38px); border: 1px solid #f3cddd; border-radius: 24px; background: rgba(255,255,255,.94); box-shadow: 0 18px 55px rgba(104,56,76,.09); }
    .back-link { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 34px; color: #9a315d; font-size: .94rem; font-weight: 650; text-decoration: none; }
    .eyebrow { margin: 0 0 10px; color: #bd7894; font-size: .72rem; font-weight: 800; letter-spacing: .16em; }
    h1 { margin: 0; color: #8e204a; font-family: Georgia,"Times New Roman",serif; font-size: clamp(2rem,7vw,2.8rem); }
    .empty-state { margin-top: 22px; padding: 22px; border: 1px dashed #efc9d8; border-radius: 16px; color: #a17e8d; background: #fffafd; }
  </style>
</head>
<body>
  <main class="info-page">
    <section class="info-card">
      <a class="back-link" href="index.html">← Back to menu</a>
      <p class="eyebrow">WONDERPEPS PH</p>
      <h1>COA</h1>
      <div class="empty-state" aria-live="polite">Content will be available here soon.</div>
    </section>
  </main>
</body>
</html>
