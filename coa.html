<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="storefront.css">

<body class="info-page-body" data-info-page="coa">
  <header class="info-topbar">
    <a class="info-back" href="index.html" aria-label="Back to WonderPeps menu">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7"/></svg>

    <a class="info-brand" href="index.html">WonderPeps</a>

  <main class="info-main">
    <p class="info-eyebrow">WONDERPEPS PH</p>
    <h1>COA</h1>

        <span>When media is added, you can find it here.</span>
